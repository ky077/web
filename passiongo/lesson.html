<script>
(function () {
  var courseMapUrl = 'Content/js/course-map.json';
  var defaultTermId = 'grade5-upper-1';
  var defaultLessonOrder = 4;

  var getQueryValue = function (key) {
    return new URLSearchParams(window.location.search).get(key);
  };

  var findTerm = function (courseMapData, termId) {
    for (var i = 0; i < courseMapData.terms.length; i++) {
      if (courseMapData.terms[i].id === termId) {
        return courseMapData.terms[i];
      }
    }

    return courseMapData.terms[0] || null;
  };

  var findLesson = function (term, lessonOrder) {
    for (var unitIndex = 0; unitIndex < term.units.length; unitIndex++) {
      var unit = term.units[unitIndex];

      for (var lessonIndex = 0; lessonIndex < unit.lessons.length; lessonIndex++) {
        if (unit.lessons[lessonIndex].order === lessonOrder) {
          return {
            unit: unit,
            lesson: unit.lessons[lessonIndex]
          };
        }
      }
    }

    return null;
  };

  var setText = function (selector, text) {
    var element = document.querySelector(selector);

    if (element) {
      element.textContent = text;
    }
  };

  var renderLessonHeader = function (courseMapData) {
    var termId = getQueryValue('term') || courseMapData.defaultTermId || defaultTermId;
    var lessonOrder = parseInt(getQueryValue('lesson') || defaultLessonOrder, 10);
    var term = findTerm(courseMapData, termId);
    var lessonData = term ? findLesson(term, lessonOrder) : null;

    if (!term || !lessonData) {
      return;
    }

    var lessonLabel = 'Lesson ' + lessonData.lesson.order;
    var fullLessonTitle = lessonLabel + ' ' + lessonData.lesson.title;
    var termLink = document.querySelector('.lesson-term-link');

    if (termLink) {
      var lessons = (term.units || []).reduce(function (allLessons, unit) {
        return allLessons.concat(unit.lessons || []);
      }, []);
      var firstLesson = lessons.length ? lessons[0].order : '';
      var lastLesson = lessons.length ? lessons[lessons.length - 1].order : '';
      termLink.textContent = term.label + (firstLesson !== '' ? ' L' + firstLesson + '-L' + lastLesson : '');
      var courseMapHref = 'index-logged.html?term=' + encodeURIComponent(term.id) + '#course-list';
      termLink.href = courseMapHref;
      var backLink = document.querySelector('nav .breadcrumb-item:first-child a');
      if (backLink) {
        backLink.href = courseMapHref;
      }
      document.querySelectorAll('a[href="lesson-animation.html"], a[href="lesson-video.html"], a[href="lesson-game.html"]').forEach(function (link) {
        link.href += '?term=' + encodeURIComponent(term.id);
      });
    }

    setText('.lesson-current-breadcrumb', fullLessonTitle);
    setText('.lesson-number', lessonLabel);
    setText('.lesson-title', lessonData.lesson.title);
    document.title = fullLessonTitle + ' - AI 英語家教';
  };

  if (!window.fetch) {
    return;
  }

  fetch(courseMapUrl, {
    cache: 'no-store'
  })
    .then(function (response) {
      if (!response.ok) {
        throw new Error('Course map not found');
      }

      return response.json();
    })
    .then(renderLessonHeader)
    .catch(function () {
      return;
    });
})();
</script>
